events { worker_connections 1024; }

http {
    upstream catalogo_backend {
        server svc-catalogo:8081;
    }

    upstream pedidos_backend {
        server svc-pedidos:8082;
    }

    server {
        listen 80;
        
        location /api/v1/productos {
            proxy_pass http://catalogo_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/pedidos {
            proxy_pass http://pedidos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}